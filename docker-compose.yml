# =============================================================================
# Infrastructure stack (single-node)
# =============================================================================
# NOTE: The vector database here is *implicit*—Chroma runs embedded inside the
# langgraph-api container and persists to a local file (data/chroma/).
# For production scaling, add a dedicated vector-database service:
#
#   Option A – Chroma Server (minimal change)
#     chroma-server:
#       image: chromadb/chroma:latest
#       volumes:
#         - chroma-data:/chroma/chroma
#       ports:
#         - "8001:8000"
#
#   Option B – Qdrant (recommended for mid-scale)
#     qdrant:
#       image: qdrant/qdrant:latest
#       volumes:
#         - qdrant-data:/qdrant/storage
#       ports:
#         - "6333:6333"
#
#   Option C – Milvus (enterprise / SaaS scale)
#     milvus-standalone:
#       image: milvusdb/milvus:latest
#       volumes:
#         - milvus-data:/var/lib/milvus
#       ports:
#         - "19530:19530"
#
# After adding the service, update backend/src/agent/knowledge_base.py to
# connect to the network endpoint instead of the local file path.
# =============================================================================

volumes:
  langgraph-data:
    driver: local
services:
  langgraph-redis:
    image: docker.io/redis:6
    container_name: langgraph-redis
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 1s
      retries: 5
  langgraph-postgres:
    image: docker.io/postgres:16-alpine
    container_name: langgraph-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - langgraph-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres
      start_period: 10s
      timeout: 1s
      retries: 5
      interval: 5s
  langgraph-api:
    image: gemini-fullstack-langgraph
    container_name: langgraph-api
    ports:
      - "8123:8000"
    depends_on:
      langgraph-redis:
        condition: service_healthy
      langgraph-postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      REDIS_URI: redis://langgraph-redis:6379
      POSTGRES_URI: postgres://postgres:postgres@langgraph-postgres:5432/postgres?sslmode=disable
      DATABASE_URI: postgres://postgres:postgres@langgraph-postgres:5432/postgres?sslmode=disable
